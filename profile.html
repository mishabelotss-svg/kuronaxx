<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мой профиль - Kuronaxx</title>
    <style>
        :root {
            --primary: #66c0f4;
            --secondary: #4b7bac;
            --dark: #1b2838;
            --light: #c7d5e0;
            --accent: #2a475e;
            --text-muted: rgba(199, 213, 224, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(90deg, #000000 0%, var(--dark) 15%, var(--dark) 85%, #000000 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка и меню (как на всех страницах) */
        header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-img {
            height: 45px;
            width: auto;
            display: block;
        }
        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back-btn {
            color: var(--light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }
        .category-bar {
            background: #171a21;
            border-bottom: 1px solid #2d2f33;
            padding: 10px 0;
            width: 100%;
            position: sticky;
            top: 60px;
            z-index: 99;
        }
        .category-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        .category-item {
            color: #b8b6b4;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .category-item:hover { color: white; border-bottom-color: var(--primary); }
        .category-item.active { color: white; border-bottom-color: var(--primary); font-weight: 600; }
        .dropdown { position: relative; }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #2a2d33;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 1500;
            border-radius: 4px;
            margin-top: 8px;
            padding: 10px 0;
        }
        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu { display: block; }
        }
        @media (max-width: 768px) {
            .dropdown-menu {
                display: none;
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown-menu.show { display: block; }
        }
        .submenu-content { padding: 10px 15px; color: white; }
        .submenu-content a[href] {
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }
        .submenu-content a[href]:hover { color: var(--primary); }

        /* ----- ОСНОВНАЯ ОБЛАСТЬ С ФОНОВЫМ БАННЕРОМ ----- */
        .profile-section {
            position: relative;
            flex: 1;
        }

        /* Фиксированное фоновое изображение */
        .profile-section::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/backandprofil.jpg');
            background-size: auto 445px;
            background-repeat: no-repeat;
            background-position: center 110px;
            opacity: 1;
            pointer-events: none;
            z-index: 0;
        }

        /* Затемнение и переходы поверх фона */
        .profile-overlay {
            position: relative;
            z-index: 2;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.6) 0%,
                transparent 120px,
                transparent calc(100% - 80px),
                rgba(0,0,0,0.6) 100%
            );
        }

        /* Боковые затемнения (градиент к чёрному) */
        .profile-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                #000000 0%,
                transparent 10%,
                transparent 90%,
                #000000 100%
            );
            pointer-events: none;
            z-index: 3;
        }

        /* Контейнер профиля */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 5%;
            position: relative;
            z-index: 4;
        }

        .profile-card {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid var(--primary);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-info { flex: 1; }
        .profile-name {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .profile-status {
            color: #5cba5c;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(92,186,92,0.15);
            padding: 4px 12px;
            border-radius: 40px;
        }
        .profile-status::before { content: "●"; font-size: 0.8rem; }
        .profile-meta {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .meta-item {
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .info-block {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .info-block:hover {
            transform: translateY(-5px);
            background: rgba(0,0,0,0.5);
        }
        .block-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            padding-left: 12px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .bio-text { line-height: 1.6; color: rgba(255,255,255,0.9); }
        .achievements-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .achievement {
            background: rgba(102,192,244,0.15);
            border: 1px solid rgba(102,192,244,0.3);
            border-radius: 40px;
            padding: 6px 15px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .achievement::before { content: "🏆"; font-size: 1rem; }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .wish-mini-card {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .wish-mini-card:hover {
            transform: translateY(-5px);
            background: rgba(0,0,0,0.6);
        }
        .wish-mini-img {
            height: 100px;
            background-size: cover;
            background-position: center;
        }
        .wish-mini-title {
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .review-mini-item {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            padding: 12px;
            border-radius: 12px;
        }
        .review-mini-game { font-weight: 600; color: var(--primary); margin-bottom: 6px; font-size: 0.9rem; }
        .review-mini-text { font-size: 0.85rem; color: rgba(255,255,255,0.9); line-height: 1.4; }
        .review-mini-date { font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 6px; text-align: right; }

        .edit-profile-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            display: inline-block;
        }
        .edit-profile-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .authors-footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 5;
        }
        .developer-block {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 40px;
        }
        .author-name {
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }
        .social-link { display: inline-flex; align-items: center; transition: transform 0.2s; text-decoration: none; }
        .social-link:hover { transform: translateY(-2px); }
        .social-icon { width: 24px; height: 24px; vertical-align: middle; }

        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; gap: 15px; }
            .profile-info { text-align: center; }
            .profile-meta { justify-content: center; }
            .avatar { width: 100px; height: 100px; }
            .profile-name { font-size: 1.8rem; }
            .block-title { font-size: 1.2rem; }
            .category-container { justify-content: center; }
            .dropdown-menu {
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown:hover .dropdown-menu { display: none; }
            .dropdown.active .dropdown-menu { display: block; }
            .profile-section::before {
                background-position: center 80px;
            }
        }

        /* На телефонах фон остаётся (как вы просили) */
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <img src="images/logo.png" alt="Kuronaxx" class="logo-img">
            <span class="logo-text">Kurona</span>
        </a>
        <a href="index.html" class="back-btn">← Назад к каталогу</a>
    </header>

    <div class="category-bar">
        <div class="category-container">
            <div class="dropdown">
                <a href="index.html" class="category-item" id="mainDropdownToggle">Главная</a>
                <div class="dropdown-menu" id="mainDropdownMenu">
                    <div class="submenu-content"><a href="new.html">Новинки →</a></div>
                    <div class="submenu-content"><a href="wishlist.html">Список желаемого →</a></div>
                </div>
            </div>
            <a href="info.html" class="category-item">Информация</a>

    </div>

    <!-- Область профиля с фоном -->
    <div class="profile-section">
        <div class="profile-overlay">
            <div class="container" id="profileContainer">
                <div style="text-align: center; padding: 50px;">Загрузка профиля...</div>
            </div>
        </div>
    </div>

    <footer class="authors-footer">
        <span class="footer-label">Разработчики :</span>
        <div class="developer-block">
            <span class="author-name">Белоцерковец Михаил</span>
            <a href="https://t.me/oblakk7" target="_blank" class="social-link" rel="noopener noreferrer">

    <script src="scripts/auth.js"></script>
    <script src="scripts/games.js"></script>
    <script>
        (function() {
            function showError(message) {
                document.getElementById('profileContainer').innerHTML = `
                    <div style="background: rgba(255,80,80,0.1); border-left: 4px solid #ff5555; padding: 20px; border-radius: 16px;">
                        <h3>⚠️ Ошибка загрузки профиля</h3>
                        <p>${message}</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">Проверьте, что файлы <strong>scripts/auth.js</strong> и <strong>scripts/games.js</strong> существуют и не содержат ошибок.</p>
                        <p><a href="index.html" style="color: var(--primary);">Вернуться на главную</a></p>
                    </div>
                `;
            }

            window.addEventListener('DOMContentLoaded', function() {
                if (typeof getCurrentUser === 'undefined') {
                    showError('Функция авторизации не найдена. Убедитесь, что файл <strong>scripts/auth.js</strong> загружен корректно и содержит функцию getCurrentUser().');
                    return;
                }

                const user = getCurrentUser();
                if (!user) {
                    document.getElementById('profileContainer').innerHTML = `
                        <div style="text-align: center; padding: 50px;">
                            <h1>Вы не авторизованы</h1>
                            <p><a href="login.html" style="color: var(--primary); font-size: 1.2rem;">Войти в аккаунт</a></p>
                        </div>
                    `;
                    return;
                }

                if (typeof games === 'undefined') {
                    console.warn('Массив games не определён. Некоторые данные о играх могут отсутствовать.');
                    window.games = [];
                }

                const regDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString('ru-RU') : 'неизвестно';
                
                let reviewsCount = 0;
                let allReviews = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('reviews_')) {
                        const reviews = JSON.parse(localStorage.getItem(key) || '[]');
                        reviewsCount += reviews.length;
                        reviews.forEach(r => {
                            allReviews.push({ gameId: key.replace('reviews_', ''), ...r });
                        });
                    }
                }
                allReviews.sort((a,b) => new Date(b.date) - new Date(a.date));
                const lastReviews = allReviews.slice(0, 3);

                const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
                const wishlistGames = wishlist.map(item => {
                    const game = (typeof games !== 'undefined' && games.find) ? games.find(g => g.id === item.id) : null;
                    return game ? game : item;
                });

                const achievementsHtml = `
                    <div class="achievements-list">
                        <div class="achievement">Первый отзыв</div>
                        <div class="achievement">Список желаемого</div>
                        <div class="achievement">Знаток игр</div>
                    </div>
                `;

                let wishlistHtml = '';
                if (wishlistGames.length === 0) {
                    wishlistHtml = '<div style="color: rgba(255,255,255,0.7); padding: 10px;">Нет игр в желаемом</div>';
                } else {
                    wishlistHtml = '<div class="wishlist-grid">';
                    wishlistGames.forEach(game => {
                        if (!game.image) return;
                        wishlistHtml += `
                            <a href="game.html?id=${game.id}" class="wish-mini-card">
                                <div class="wish-mini-img" style="background-image: url('${game.image}');"></div>
                                <div class="wish-mini-title">${escapeHtml(game.title)}</div>
                            </a>
                        `;
                    });
                    wishlistHtml += '</div>';
                }

                let reviewsHtml = '';
                if (lastReviews.length === 0) {
                    reviewsHtml = '<div style="color: rgba(255,255,255,0.7); padding: 10px;">Нет отзывов</div>';
                } else {
                    reviewsHtml = '<div class="reviews-list">';
                    lastReviews.forEach(rev => {
                        let gameTitle = rev.gameId;
                        if (typeof games !== 'undefined' && games.find) {
                            const game = games.find(g => g.id === rev.gameId);
                            if (game) gameTitle = game.title;
                        }
                        reviewsHtml += `
                            <div class="review-mini-item">
                                <div class="review-mini-game">${escapeHtml(gameTitle)}</div>
                                <div class="review-mini-text">${escapeHtml(rev.text.substring(0, 80))}${rev.text.length > 80 ? '...' : ''}</div>
                                <div class="review-mini-date">${rev.date}</div>
                            </div>
                        `;
                    });
                    reviewsHtml += '</div>';
                }

                const statsHtml = `
                    <div class="profile-meta">
                        <div class="meta-item">📅 Регистрация: ${regDate}</div>
                        <div class="meta-item">💬 Отзывов: ${reviewsCount}</div>
                        <div class="meta-item">🎮 В желаемом: ${wishlistGames.length}</div>
                    </div>
                `;

                const fullHtml = `
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="avatar">
                                <img src="images/avatar.jpg" alt="avatar" onerror="this.src='https://cdn.cloudflare.steamstatic.com/steamcommunity/public/images/avatars/fe/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg'">
                            </div>
                            <div class="profile-info">
                                <div class="profile-name">${escapeHtml(user.name)}</div>
                                <div class="profile-status">Активен сегодня</div>
                                ${statsHtml}
                            </div>
                        </div>

                        <div class="profile-grid">
                            <div class="info-block">
                                <div class="block-title">📖 О себе</div>
                                <div class="bio-text">Привет, я использую Kurona как сайт для подбора и обзора игр</div>
                            </div>
                            <div class="info-block">
                                <div class="block-title">🏆 Достижения</div>
                                ${achievementsHtml}
                            </div>
                            <div class="info-block">
                                <div class="block-title">⭐ Избранное (желаемое)</div>
                                ${wishlistHtml}
                            </div>
                            <div class="info-block">
                                <div class="block-title">📝 Последние отзывы</div>
                                ${reviewsHtml}
                            </div>
                        </div>

                        <div style="text-align: center; margin-top: 25px;">
                            <button class="edit-profile-btn" onclick="alert('Редактирование профиля будет доступно в следующих обновлениях')">✏️ Редактировать профиль</button>
                        </div>
                    </div>
                `;

                document.getElementById('profileContainer').innerHTML = fullHtml;
            });

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
        })();
    </script>
</body>
