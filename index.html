<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kuronaxx - Каталог видеоигр</title>
    <style>
        :root {
            --primary: #66c0f4;
            --secondary: #4b7bac;
            --dark: #1b2838;
            --light: #c7d5e0;
            --accent: #2a475e;
            --rating: #ffc107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Анимированная шапка */
        header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        header.hide {
            transform: translateY(-100%);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .login-link {
            background: var(--primary);
            padding: 8px 20px;
            border-radius: 20px;
            color: var(--dark);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .login-link:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 15px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }

        .user-name-link {
            color: var(--light);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .user-name-link:hover {
            color: var(--primary);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .search {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search input {
            width: 100%;
            padding: 10px 18px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .search input:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(102, 192, 244, 0.3);
        }

        /* Меню категорий */
        .category-bar {
            background: #171a21;
            border-bottom: 1px solid #2d2f33;
            padding: 10px 0;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .category-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .category-item {
            color: #b8b6b4;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .category-item:hover {
            color: white;
            border-bottom-color: var(--primary);
        }

        .category-item.active {
            color: white;
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #2a2d33;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 1500;
            border-radius: 4px;
            margin-top: 8px;
            padding: 10px 0;
        }

        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .dropdown-menu {
                display: none;
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown-menu.show {
                display: block;
            }
        }

        .submenu-content {
            padding: 10px 15px;
            color: white;
        }

        .submenu-content a[href] {
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        .submenu-content a[href]:hover {
            color: var(--primary);
        }

        /* ----- ОСНОВНАЯ ОБЛАСТЬ С ФОНОВЫМ БАННЕРОМ (полноэкранный, 1920×1080) ----- */
        .catalog-section {
            position: relative;
            flex: 1;
        }

        .catalog-section::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/avatar.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center 2px;
            opacity: 1;
            pointer-events: none;
            z-index: 0;
        }

        .catalog-overlay {
            position: relative;
            z-index: 2;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.5) 0%,
                transparent 120px,
                transparent calc(100% - 80px),
                rgba(0,0,0,0.5) 100%
            );
        }

        .catalog-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                #000000 0%,
                transparent 10%,
                transparent 90%,
                #000000 100%
            );
            pointer-events: none;
            z-index: 3;
        }

        .container {
            padding: 30px 5%;
            position: relative;
            z-index: 4;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .game-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        .game-image {
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .game-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        }

        .game-content {
            padding: 20px;
        }

        .game-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: white;
        }

        .game-description {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .game-rating {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .stars {
            color: var(--rating);
            margin-right: 10px;
        }

        .rating-value {
            font-weight: bold;
        }

        .wishlist-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }

        .wishlist-btn:hover {
            opacity: 0.8;
        }

        .wishlist-btn span:first-child {
            font-size: 1.5rem;
            transition: color 0.2s;
        }

        .wishlist-btn span:last-child {
            color: var(--light);
            font-size: 0.95rem;
        }

        /* --- НОВЫЙ ФУТЕР --- */
        .authors-footer {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            margin-top: 50px;
            padding: 25px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 5;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .footer-developers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .developer-block {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
        }

        .developer-block:hover {
            transform: translateY(-5px);
            background: rgba(102, 192, 244, 0.2);
            box-shadow: 0 8px 25px rgba(102, 192, 244, 0.3);
        }

        .dev-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 2px rgba(102,192,244,0.5));
        }

        .author-name {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            transition: color 0.2s;
        }

        .developer-block:hover .author-name {
            color: var(--primary);
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            transition: transform 0.2s;
            text-decoration: none;
            opacity: 0.8;
        }

        .social-link:hover {
            transform: translateY(-2px);
            opacity: 1;
        }

        .social-icon {
            width: 22px;
            height: 22px;
            vertical-align: middle;
            filter: brightness(0.9);
            transition: filter 0.2s;
        }

        .social-link:hover .social-icon {
            filter: brightness(1.2);
        }

        .footer-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .footer-separator {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .footer-copyright {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* Адаптация под мобильные */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }
            
            .search {
                width: 100%;
                max-width: 100%;
            }

            .category-container {
                justify-content: center;
            }

            .header-right {
                justify-content: center;
                width: 100%;
            }

            .user-info {
                padding: 5px 12px;
            }

            .user-name-link {
                font-size: 0.9rem;
            }

            .logout-btn {
                padding: 5px 12px;
                font-size: 0.8rem;
            }

            .dropdown-menu {
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }

            .dropdown:hover .dropdown-menu {
                display: none;
            }

            .dropdown.active .dropdown-menu {
                display: block;
            }

            .authors-footer {
                flex-direction: column;
                gap: 12px;
                padding: 20px 15px;
            }
            
            .footer-developers {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }
            
            .developer-block {
                justify-content: center;
                flex-wrap: wrap;
                padding: 8px 15px;
                gap: 10px;
            }
            
            .dev-icon {
                font-size: 1.1rem;
            }
            
            .author-name {
                font-size: 0.9rem;
            }
            
            .social-icon {
                width: 20px;
                height: 20px;
            }
            
            .footer-links {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            
            .footer-separator {
                display: none;
            }
            
            .footer-copyright {
                font-size: 0.7rem;
            }

            /* На телефонах фоновое изображение отключаем */
            .catalog-section::before {
                display: none;
            }
            .catalog-overlay {
                background: var(--dark);
            }
            .catalog-overlay::before {
                display: none;
            }
            .game-card {
                backdrop-filter: none;
            }
        }

        /* Десктопная версия: показываем фон */
        @media (min-width: 769px) {
            .catalog-section::before {
                opacity: 1;
            }
            .catalog-overlay {
                background: linear-gradient(
                    to bottom,
                    var(--dark) 0%,
                    transparent 120px,
                    transparent calc(100% - 80px),
                    var(--dark) 100%
                );
            }
        }
    </style>
</head>

                title: "Elden Ring",
                image: "https://cdn.cloudflare.steamstatic.com/steam/apps/1245620/header.jpg",
                description: "Фэнтезийная action-RPG от создателей Dark Souls",
                rating: 4.8
            },
            {
                id: "fifa26",
                title: "EA SPORTS FC 26",
                image: "https://drop-assets.ea.com/images/4c7xKKfueTCbSbHbfU5fKM/db6c49c1cc9c9e239658839ac330b8e0/sdt_edit.jpg?im=AspectCrop=(16,9),xPosition=0.5,yPosition=0.5;Resize=(1280)&q=85",

            {

                title: "Forza Horizon 6",
                image: "https://img.redbull.com/images/c_crop,w_1920,h_960,x_0,y_0/c_auto,w_1200,h_630/f_auto,q_auto/redbullcom/2025/9/26/mhtahgg8zbgibnvcbz2w/forza-horizon-6-artwork",

                rating: 4.8
            }
        ];

        function displayGames(gamesToShow) {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';

            const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');

            gamesToShow.forEach(game => {
                const isInWishlist = wishlist.some(item => item.id === game.id);
                const heartColor = isInWishlist ? 'red' : '#b8b6b4';

                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `game.html?id=${game.id}`;
                
                card.innerHTML = `
                    <div class="game-image" style="background-image: url('${game.image}')"></div>
                    <div class="game-content">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-description">${game.description}</p>
                        <div class="game-rating">
                            <div class="stars">${'★'.repeat(Math.floor(game.rating))}${'☆'.repeat(5-Math.floor(game.rating))}</div>
                            <div class="rating-value">${game.rating}/5</div>
                        </div>
                        <div class="wishlist-btn" data-id="${game.id}" data-title="${game.title}" data-image="${game.image}" data-description="${game.description}" data-rating="${game.rating}">
                            <span style="color: ${heartColor};">❤</span>
                            <span>В желаемое</span>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function filterGames() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(searchTerm)
            );
            displayGames(filteredGames);
        }

        document.addEventListener('click', function(e) {
            const wishlistBtn = e.target.closest('.wishlist-btn');
            if (!wishlistBtn) return;
            
            e.preventDefault();
            e.stopPropagation();

            const id = wishlistBtn.dataset.id;
            const title = wishlistBtn.dataset.title;
            const image = wishlistBtn.dataset.image;
            const description = wishlistBtn.dataset.description;
            const rating = parseFloat(wishlistBtn.dataset.rating);

            let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            const index = wishlist.findIndex(item => item.id === id);

            const heartSpan = wishlistBtn.querySelector('span:first-child');

            if (index === -1) {
                wishlist.push({ id, title, image, description, rating });
                heartSpan.style.color = 'red';
            } else {
                wishlist.splice(index, 1);
                heartSpan.style.color = '#b8b6b4';
            }

            localStorage.setItem('wishlist', JSON.stringify(wishlist));
        });

        function updateUserInterface() {
            const user = getCurrentUser();
            const userInfo = document.getElementById('userInfo');
            const loginLink = document.getElementById('loginLink');
            const userNameLink = document.getElementById('userNameLink');
            
            if (user) {
                if (userInfo) userInfo.style.display = 'block';
                if (loginLink) loginLink.style.display = 'none';
                if (userNameLink) userNameLink.textContent = "Мой профиль";
            } else {
                if (userInfo) userInfo.style.display = 'none';
                if (loginLink) loginLink.style.display = 'inline-block';
            }
        }

        let lastScroll = 0;
        const header = document.getElementById('mainHeader');
        
        window.addEventListener('scroll', function() {
            const currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                header.classList.add('hide');
            } else if (currentScroll < lastScroll) {
                header.classList.remove('hide');
            }
            lastScroll = currentScroll;
        });

        document.addEventListener('DOMContentLoaded', function() {
            const dropdownToggle = document.getElementById('mainDropdownToggle');
            const dropdownMenu = document.getElementById('mainDropdownMenu');
            
            if (dropdownToggle && dropdownMenu) {
                function closeDropdown() {
                    dropdownMenu.classList.remove('show');
                }

                dropdownToggle.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        e.stopPropagation();
                        dropdownMenu.classList.toggle('show');
                    }
                });

                document.addEventListener('click', function(e) {
                    if (!dropdownToggle.contains(e.target) && !dropdownMenu.contains(e.target)) {
                        closeDropdown();
                    }
                });

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        closeDropdown();
                    }
                });
            }

            displayGames(games);
            document.getElementById('searchInput').addEventListener('input', filterGames);
            updateUserInterface();
        });

        document.getElementById('logoutBtn')?.addEventListener('click', function() {
            logoutUser();
            updateUserInterface();
            window.location.reload();
        });
    </script>

    <script>
        // Всплывающее сообщение при клике на имя разработчика
        document.querySelectorAll('.developer-block').forEach(block => {
            block.addEventListener('click', (e) => {
                if (e.target.closest('.social-link')) return;
                const name = block.querySelector('.author-name')?.innerText || 'разработчик';
                const toast = document.createElement('div');
                toast.textContent = `Спасибо за посещение, ${name}!`;
                toast.style.cssText = `
                    position: fixed;
                    bottom: 30px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(0,0,0,0.8);
                    backdrop-filter: blur(10px);
                    color: #66c0f4;
                    padding: 12px 24px;
                    border-radius: 50px;
                    font-size: 1rem;
                    font-weight: 600;
                    z-index: 10000;
                    border: 1px solid rgba(102,192,244,0.3);
                    box-shadow: 0 0 20px rgba(102,192,244,0.3);
                    opacity: 0;
                    transition: opacity 0.3s;
                    pointer-events: none;
                    white-space: nowrap;
                `;
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '1'; }, 10);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            });
        });
    </script>
</body>
</html>
