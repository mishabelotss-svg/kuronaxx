f<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Детали игры - Kuronaxx</title>
    <style>
        :root {
            --primary: #66c0f4;
            --secondary: #4b7bac;
            --dark: #1b2838;
            --light: #c7d5e0;
            --accent: #2a475e;
            --success: #5c7e10;
            --text-muted: rgba(199, 213, 224, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
            vertical-align: middle;
            display: block;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-btn {
            color: var(--light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .category-bar {
            background: #171a21;
            border-bottom: 1px solid #2d2f33;
            padding: 10px 0;
            width: 100%;
            position: relative;
            z-index: 1000;
        }

        .category-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .category-item {
            color: #b8b6b4;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .category-item:hover {
            color: white;
            border-bottom-color: var(--primary);
        }

        .category-item.active {
            color: white;
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #2a2d33;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 1500;
            border-radius: 4px;
            margin-top: 8px;
            padding: 10px 0;
        }

        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .dropdown-menu {
                display: none;
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown-menu.show {
                display: block;
            }
        }

        .submenu-content {
            padding: 10px 15px;
            color: white;
        }

        .submenu-content a[href] {
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        .submenu-content a[href]:hover {
            color: var(--primary);
        }

        .container {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-header {
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* --- Стили для видеофона --- */
        .hero-video-container {
            position: relative;
            width: calc(100% + 10%);
            margin-left: -5%;
            margin-right: -5%;
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .hero-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 150px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(1px);
            border-radius: 0;
        }
        .glass-effect {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 100px;
        }
        .hero-video-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, var(--dark), transparent);
            pointer-events: none;
            z-index: 1;
        }

        @media (min-width: 769px) {
            .hero-video-container {
                width: calc(100% + 10%);
                margin-left: -5%;
                border-radius: 15px;
            }
            .hero-content {
                border-radius: 15px;
            }
        }
        /* --- Конец стилей видеофона --- */

        .gallery {
            position: relative;
            margin: 40px 0;
            border-radius: 12px;
            overflow: hidden;
            height: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .gallery-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .gallery-btn {
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .gallery-btn:hover {
            background: rgba(0,0,0,0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .game-info {
            margin: 40px 0;
        }

        .game-description {
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* --- Анимированная кнопка --- */
        .play-btn {
            display: inline-block;
            padding: 16px 42px;
            background: linear-gradient(135deg, #1e7e34, #00b894);
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin: 20px 0;
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
            backdrop-filter: blur(2px);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            animation: gentlePulse 2s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(0, 184, 148, 0.5);
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .play-btn:hover::before {
            left: 100%;
        }

        .play-btn:hover {
            animation: strongPulse 1s infinite ease-in-out;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 184, 148, 0.8), 0 10px 20px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .play-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        @keyframes gentlePulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0, 184, 148, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); }
        }

        @keyframes strongPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 184, 148, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            animation: particleFade 0.6s forwards;
        }

        @keyframes particleFade {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--dx, 40px), var(--dy, -40px)) scale(0);
                opacity: 0;
            }
        }
        /* --- Конец кнопки --- */

        .reviews-section {
            margin-top: 60px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .review-form {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 0 2px var(--primary);
        }

        textarea.form-input {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .submit-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .review-list {
            margin-top: 30px;
        }

        .review-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }

        .review-author {
            font-weight: 600;
            color: white;
        }

        .review-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .review-content {
            color: rgba(255,255,255,0.9);
        }

        .authors-footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .authors-footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
        }

        .footer-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .developer-block {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 40px;
            margin: 5px;
        }

        .author-name {
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .social-link:hover {
            transform: translateY(-2px);
        }

        .social-icon {
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }

        /* Адаптация под мобильные */
        @media (max-width: 768px) {
            .gallery {
                height: 300px;
            }
            .game-title {
                font-size: 2rem;
            }
            .gallery-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .category-container {
                justify-content: center;
            }
            .dropdown-menu {
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown:hover .dropdown-menu {
                display: none;
            }
            .dropdown.active .dropdown-menu {
                display: block;
            }
            .authors-footer {
                flex-direction: column;
                gap: 12px;
            }
            .developer-block {
                flex-wrap: wrap;
                justify-content: center;
            }
            .hero-video-container {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                border-radius: 0;
            }
            .hero-content {
                border-radius: 0;
                padding: 15px;
            }
        }
    </style>
</head>

                subtitle: "Тёмное фэнтези от создателей Dark Souls",
                description: "Elden Ring — это ролевая игра с открытым миром, разработанная FromSoftware. Действие происходит в мире, созданном совместно с писателем Джорджем Мартином. Игроки исследуют Междуземье, сражаются с могущественными врагами и раскрывают тайны Кольца Элден.",
                images: [
                    "images/eldenring/Elden_Ring_game_screen.jpg",
                    "images/eldenring/7664-1743113235-1188337068.webp",
                    "images/eldenring/i 1.webp"
                ],
                officialUrl: "https://store.steampowered.com/app/1245620/Elden_Ring/"
            },
            {
                id: "fifa26",
                title: "EA SPORTS FC 26",
                subtitle: "Официальный футбольный симулятор",
                description: "EA SPORTS FC 26 продолжает традиции лучших футбольных симуляторов. Новый движок HyperMotion V, улучшенный искусственный интеллект и ещё больше лицензированных клубов. Режимы карьеры, Ultimate Team и VOLTA FOOTBALL ждут вас. Погрузитесь в атмосферу настоящего футбола!",
                images: [
                    "https://drop-assets.ea.com/images/20bYTiyLR8hjpst7WOruQi/c8d8a7ebe79bdb7dde9defb0147a11d7/FC26_Rev_Neuer_Gameplay_16x9.jpg?im=AspectCrop=(16,9),xPosition=0.5,yPosition=0.5;Resize=(1280)&q=85",
                    "https://drop-assets.ea.com/images/38KPvJkmt87CQ4QEDcdsrG/548bb708b526d0981f8eac4dd4c595fa/FC26_Rev_Musiala_Gameplay_16x9.jpg?im=AspectCrop=(16,9),xPosition=0.5,yPosition=0.5;Resize=(1280)&q=85",
                    "https://drop-assets.ea.com/images/2OiswZIkuSnHFY7fLFQezL/95ef5c5101cd4ecbbe672def1f6d9fe6/FC26_Rev_LuisHenrique_Careers_16x9.jpg?im=AspectCrop=(16,9),xPosition=0.5,yPosition=0.5;Resize=(1280)&q=85"
                ],
                officialUrl: "https://www.ea.com/games/ea-sports-fc/fc-26"
            },
            {
                id: "forzah6",
                title: "Forza Horizon 6",
                subtitle: "Гоночная аркада с открытым миром",
                description: "Forza Horizon 6 — новейшая часть популярной серии гоночных аркад. Исследуйте огромный открытый мир, наполненный захватывающими трассами, живописными пейзажами и динамическими погодными условиями. Сотни лицензированных автомобилей, глубокая система тюнинга и множество режимов игры: от уличных гонок до экстремальных состязаний. Присоединяйтесь к фестивалю Horizon и станьте легендой гонок!",
                images: [
                    "https://store-images.s-microsoft.com/image/apps.47378.13758467164481545.c998f207-34a5-4a78-8843-178e2acdf371.03eedef7-4b05-43fd-ade7-749331072d37",
                    "https://store-images.s-microsoft.com/image/apps.8335.14202278764680089.8e4c786a-0a1c-4737-a244-0bdfa34aab7b.8db5919c-3933-4150-9cb3-676123ae21e0",
                    "https://store-images.s-microsoft.com/image/apps.15199.14202278764680089.8e4c786a-0a1c-4737-a244-0bdfa34aab7b.36f3225c-6723-41d0-9828-98ad4d758c91"
                ],
                officialUrl: "https://www.xbox.com/ru-RU/games/store/forza-horizon-6/9PFDT5X4RH8B"
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        const game = games.find(g => g.id === gameId);
        const dynamicContainer = document.getElementById('dynamicContent');

        if (!game) {
            document.body.innerHTML = '<div style="text-align: center; padding: 50px;"><h1>Игра не найдена</h1><a href="index.html" style="color: var(--primary);">Вернуться к каталогу</a></div>';
        } else {
            document.getElementById('gameTitle').textContent = game.title;
            document.getElementById('gameSubtitle').textContent = game.subtitle;

            let contentHtml = `
                <div class="gallery">
                    <img src="${game.images[0]}" alt="" class="gallery-main" id="mainImage">
                    <div class="gallery-nav">
                        <button class="gallery-btn" id="prevBtn">←</button>
                        <button class="gallery-btn" id="nextBtn">→</button>
                    </div>
                </div>
                <div class="game-info">
                    <p class="game-description">${game.description}</p>
                    <a href="${game.officialUrl}" class="play-btn" id="playBtn">Играть</a>
                </div>
            `;

            // Добавляем видеофон для Forza Horizon 6, Cyberpunk 2077, Dota 2 и GTA V
            if (gameId === 'forzah6') {
                contentHtml = `
                    <div class="hero-video-container">
                        <video autoplay loop muted playsinline class="hero-bg-video">
                            <source src="videos/backsideforza6.mp4" type="video/mp4">
                        </video>
                        <div class="hero-content">
                            <div class="glass-effect">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else if (gameId === 'cyberpunk2077') {
                contentHtml = `
                    <div class="hero-video-container">
                        <video autoplay loop muted playsinline class="hero-bg-video">
                            <source src="videos/backsidecyber77.mp4" type="video/mp4">
                        </video>
                        <div class="hero-content">
                            <div class="glass-effect">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else if (gameId === 'dota2') {
                contentHtml = `
                    <div class="hero-video-container">
                        <video autoplay loop muted playsinline class="hero-bg-video">
                            <source src="videos/backsidedota.mp4" type="video/mp4">
                        </video>
                        <div class="hero-content">
                            <div class="glass-effect">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else if (gameId === 'gta5') {
                contentHtml = `
                    <div class="hero-video-container">
                        <video autoplay loop muted playsinline class="hero-bg-video">
                            <source src="videos/backsidegta5.mp4" type="video/mp4">
                        </video>
                        <div class="hero-content">
                            <div class="glass-effect">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            dynamicContainer.innerHTML = contentHtml;

            let currentImageIndex = 0;
            const mainImage = document.getElementById('mainImage');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (prevBtn && nextBtn && game.images.length > 1) {
                prevBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex - 1 + game.images.length) % game.images.length;
                    mainImage.src = game.images[currentImageIndex];
                });
                nextBtn.addEventListener('click', () => {
                    currentImageIndex = (currentImageIndex + 1) % game.images.length;
                    mainImage.src = game.images[currentImageIndex];
                });
            }

            const reviewList = document.getElementById('reviewList');
            const reviewName = document.getElementById('reviewName');
            const reviewText = document.getElementById('reviewText');
            const submitBtn = document.getElementById('submitReview');
            const storageKey = `reviews_${gameId}`;

            function loadReviews() {
                const reviews = JSON.parse(localStorage.getItem(storageKey) || '[]');
                reviewList.innerHTML = '';
                reviews.forEach(review => {
                    const item = document.createElement('div');
                    item.className = 'review-item';
                    item.innerHTML = `
                        <div class="review-header">
                            <span class="review-author">${escapeHtml(review.name)}</span>
                            <span class="review-date">${review.date}</span>
                        </div>
                        <div class="review-content">${escapeHtml(review.text)}</div>
                    `;
                    reviewList.appendChild(item);
                });
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    const name = reviewName.value.trim();
                    const text = reviewText.value.trim();
                    if (!name || !text) {
                        alert('Пожалуйста, заполните имя и отзыв');
                        return;
                    }
                    const reviews = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    reviews.push({
                        name: name,
                        text: text,
                        date: new Date().toLocaleDateString('ru-RU')
                    });
                    localStorage.setItem(storageKey, JSON.stringify(reviews));
                    reviewName.value = '';
                    reviewText.value = '';
                    loadReviews();
                });
            }
            loadReviews();

            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
                function createParticle(x, y, container) {
                    const particle = document.createElement('span');
                    particle.classList.add('particle');
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.width = `${Math.random() * 8 + 4}px`;
                    particle.style.height = particle.style.width;
                    particle.style.background = `radial-gradient(circle, #00ff9d, #008f5f)`;
                    particle.style.setProperty('--dx', `${(Math.random() - 0.5) * 100}px`);
                    particle.style.setProperty('--dy', `${(Math.random() - 0.5) * 100 - 40}px`);
                    container.appendChild(particle);
                    setTimeout(() => particle.remove(), 700);
                }

                function addParticles(event) {
                    const rect = playBtn.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    for (let i = 0; i < 12; i++) {
                        createParticle(x, y, playBtn);
                    }
                }

                playBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    addParticles(e);
                    setTimeout(() => {
                        window.location.href = playBtn.href;
                    }, 200);
                });
            }
        }
    </script>
</body>
</html>
