<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Детали игры - Kuronaxx</title>
    <style>
        :root {
            --primary: #66c0f4;
            --secondary: #4b7bac;
            --dark: #1b2838;
            --light: #c7d5e0;
            --accent: #2a475e;
            --success: #5c7e10;
            --text-muted: rgba(199, 213, 224, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
            vertical-align: middle;
            display: block;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-btn {
            color: var(--light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .category-bar {
            background: #171a21;
            border-bottom: 1px solid #2d2f33;
            padding: 10px 0;
            width: 100%;
            position: relative;
            z-index: 1000;
        }

        .category-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .category-item {
            color: #b8b6b4;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .category-item:hover {
            color: white;
            border-bottom-color: var(--primary);
        }

        .category-item.active {
            color: white;
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #2a2d33;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 1500;
            border-radius: 4px;
            margin-top: 8px;
            padding: 10px 0;
        }

        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .dropdown-menu {
                display: none;
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown-menu.show {
                display: block;
            }
        }

        .submenu-content {
            padding: 10px 15px;
            color: white;
        }

        .submenu-content a[href] {
            color: white;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        .submenu-content a[href]:hover {
            color: var(--primary);
        }

        .container {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-header {
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* --- Стили для видеофона --- */
        .hero-video-container {
            position: relative;
            width: calc(100% + 10%);
            margin-left: -5%;
            margin-right: -5%;
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .hero-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 80px 40px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            border-radius: 0;
        }
        .glass-effect {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 0;
        }
        .hero-video-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, var(--dark), transparent);
            pointer-events: none;
            z-index: 1;
        }

        @media (min-width: 769px) {
            .hero-video-container {
                width: calc(100% + 10%);
                margin-left: -5%;
                border-radius: 15px;
            }
            .hero-content {
                border-radius: 15px;
            }
        }
        /* --- Конец стилей видеофона --- */

        /* --- Стили для галереи (только скриншоты) --- */
        .gallery {
            position: relative;
            margin: 40px 0;
            border-radius: 12px;
            overflow: hidden;
            height: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }

        .gallery-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .gallery-btn {
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .gallery-btn:hover {
            background: rgba(0,0,0,0.8);
            transform: scale(1.1);
        }

        .gallery-dots {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }
        /* --- Конец стилей галереи --- */

        .game-info {
            margin: 0;
        }

        .game-description {
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* --- Контейнер для кнопок --- */
        .button-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0 0 0;
        }

        /* --- Анимированная кнопка "Играть" --- */
        .play-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #1e7e34, #00b894);
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: center;
            flex: 1;
            min-width: 180px;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .play-btn:hover::before {
            left: 100%;
        }

        .play-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 184, 148, 0.8), 0 10px 20px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .play-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* --- Кнопка "Обзор игры" --- */
        .trailer-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #4b7bac, #2a475e);
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: center;
            flex: 1;
            min-width: 180px;
        }

        .trailer-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .trailer-btn:hover::before {
            left: 100%;
        }

        .trailer-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 20px rgba(102, 192, 244, 0.5);
            letter-spacing: 2px;
        }

        .trailer-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Модальное окно для видео */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
            background: #000;
            border-radius: 15px;
        }

        .modal-video {
            width: 100%;
            height: 500px;
            border: none;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .modal-content {
                margin: 15% auto;
                width: 95%;
            }
            .modal-video {
                height: 300px;
            }
            .button-group {
                flex-direction: column;
            }
            .play-btn, .trailer-btn {
                width: 100%;
            }
            .hero-content {
                padding: 30px 20px;
            }
        }

        .reviews-section {
            margin-top: 60px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .review-form {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 0 2px var(--primary);
        }

        textarea.form-input {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .submit-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .review-list {
            margin-top: 30px;
        }

        .review-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
        }

        .review-author {
            font-weight: 600;
            color: white;
        }

        .review-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .review-content {
            color: rgba(255,255,255,0.9);
        }

        /* --- НОВЫЙ ФУТЕР --- */
.authors-footer {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(5px);
    margin-top: 50px;
    padding: 25px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    position: relative;
    z-index: 5;
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.footer-developers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
}

.developer-block {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 20px;
    border-radius: 50px;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    cursor: pointer;
}

.developer-block:hover {
    transform: translateY(-5px);
    background: rgba(102, 192, 244, 0.2);
    box-shadow: 0 8px 25px rgba(102, 192, 244, 0.3);
}

.dev-icon {
    font-size: 1.3rem;
    filter: drop-shadow(0 0 2px rgba(102,192,244,0.5));
}

.author-name {
    font-size: 1rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    transition: color 0.2s;
}

.developer-block:hover .author-name {
    color: var(--primary);
}

.social-link {
    display: inline-flex;
    align-items: center;
    transition: transform 0.2s;
    text-decoration: none;
    opacity: 0.8;
}

.social-link:hover {
    transform: translateY(-2px);
    opacity: 1;
}

.social-icon {
    width: 22px;
    height: 22px;
    vertical-align: middle;
    filter: brightness(0.9);
    transition: filter 0.2s;
}

.social-link:hover .social-icon {
    filter: brightness(1.2);
}

.footer-links {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

.footer-link {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.2s;
}

.footer-link:hover {
    color: var(--primary);
    text-decoration: underline;
}

.footer-separator {
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.8rem;
}

.footer-copyright {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
}

/* Адаптация под телефон */
@media (max-width: 768px) {
    .authors-footer {
        padding: 20px 15px;
    }
    
    .footer-developers {
        flex-direction: column;
        gap: 15px;
        width: 100%;
    }
    
    .developer-block {
        justify-content: center;
        flex-wrap: wrap;
        padding: 8px 15px;
        gap: 10px;
    }
    
    .dev-icon {
        font-size: 1.1rem;
    }
    
    .author-name {
        font-size: 0.9rem;
    }
    
    .social-icon {
        width: 20px;
        height: 20px;
    }
    
    .footer-links {
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }
    
    .footer-separator {
        display: none;
    }
    
    .footer-copyright {
        font-size: 0.7rem;
    }
}

        /* Адаптация под мобильные */
        @media (max-width: 768px) {
            .gallery {
                height: 300px;
            }
            .game-title {
                font-size: 2rem;
            }
            .gallery-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .category-container {
                justify-content: center;
            }
            .dropdown-menu {
                position: static;
                box-shadow: none;
                background: transparent;
                padding-left: 20px;
            }
            .dropdown:hover .dropdown-menu {
                display: none;
            }
            .dropdown.active .dropdown-menu {
                display: block;
            }
            .authors-footer {
                flex-direction: column;
                gap: 12px;
            }
            .developer-block {
                flex-wrap: wrap;
                justify-content: center;
            }
            .hero-video-container {
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                border-radius: 0;
            }
            .hero-content {
                border-radius: 0;
                padding: 20px;
            }
        }
    </style>
</head>

                images: [

                ],
                trailerUrl: "https://www.youtube.com/embed/3_15DKSw67k",
                officialUrl: "https://www.ea.com/games/ea-sports-fc/fc-26"
            },
            {
                id: "forzah6",
                title: "Forza Horizon 6",
                subtitle: "Гоночная аркада с открытым миром",
                description: "Forza Horizon 6 — новейшая часть популярной серии гоночных аркад. Исследуйте огромный открытый мир, наполненный захватывающими трассами, живописными пейзажами и динамическими погодными условиями. Сотни лицензированных автомобилей, глубокая система тюнинга и множество режимов игры: от уличных гонок до экстремальных состязаний. Присоединяйтесь к фестивалю Horizon и станьте легендой гонок!",
                images: [
                    "https://store-images.s-microsoft.com/image/apps.47378.13758467164481545.c998f207-34a5-4a78-8843-178e2acdf371.03eedef7-4b05-43fd-ade7-749331072d37",
                    "https://store-images.s-microsoft.com/image/apps.8335.14202278764680089.8e4c786a-0a1c-4737-a244-0bdfa34aab7b.8db5919c-3933-4150-9cb3-676123ae21e0",
                    "https://store-images.s-microsoft.com/image/apps.15199.14202278764680089.8e4c786a-0a1c-4737-a244-0bdfa34aab7b.36f3225c-6723-41d0-9828-98ad4d758c91"
                ],
                trailerUrl: "затычка",
                officialUrl: "https://www.xbox.com/ru-RU/games/store/forza-horizon-6/9PFDT5X4RH8B"
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        const game = games.find(g => g.id === gameId);
        const dynamicContainer = document.getElementById('dynamicContent');

        if (!game) {
            document.body.innerHTML = '<div style="text-align: center; padding: 50px;"><h1>Игра не найдена</h1><a href="index.html" style="color: var(--primary);">Вернуться к каталогу</a></div>';
        } else {
            document.getElementById('gameTitle').textContent = game.title;
            document.getElementById('gameSubtitle').textContent = game.subtitle;

            // Формируем массив элементов галереи (только изображения)
            let galleryItems = [];
            
            // Добавляем все изображения
            game.images.forEach(img => {
                galleryItems.push({
                    type: 'image',
                    url: img
                });
            });

            // Рендерим галерею
            let galleryHtml = '';
            if (galleryItems.length > 0) {
                galleryHtml = `
                    <div class="gallery" id="galleryContainer">
                        <div class="gallery-item" id="galleryItem"></div>
                        <div class="gallery-nav">
                            <button class="gallery-btn" id="prevBtn">←</button>
                            <button class="gallery-btn" id="nextBtn">→</button>
                        </div>
                        <div class="gallery-dots" id="galleryDots"></div>
                    </div>
                `;
            }

            // Формируем содержимое для героя (фон + контент)
            let heroContentHtml = `
                ${galleryHtml}
                <div class="game-info">
                    <p class="game-description">${game.description}</p>
                </div>
            `;

            // Для игр с видеофоном – оборачиваем в hero-блок
            const hasVideoHero = (gameId === 'forzah6' || gameId === 'cyberpunk2077' || gameId === 'dota2' || gameId === 'gta5');
            let contentHtml = '';

            if (hasVideoHero) {
                // Выбираем правильный путь к видео
                let videoSrc = '';
                if (gameId === 'forzah6') videoSrc = 'videos/backsideforza6.mp4';
                else if (gameId === 'cyberpunk2077') videoSrc = 'videos/backsidecyber77.mp4';
                else if (gameId === 'dota2') videoSrc = 'videos/backsidedota.mp4';
                else if (gameId === 'gta5') videoSrc = 'videos/backsidegta5.mp4';

                contentHtml = `
                    <div class="hero-video-container">
                        <video autoplay loop muted playsinline class="hero-bg-video">
                            <source src="${videoSrc}" type="video/mp4">
                        </video>
                        <div class="hero-content">
                            <div class="glass-effect">
                                ${heroContentHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                contentHtml = heroContentHtml;
            }

            // Добавляем кнопки (они будут после hero-блока)
            let buttonsHtml = `
                <div class="button-group">
                    <a href="${game.officialUrl}" class="play-btn" id="playBtn">Играть</a>
            `;
            
            // Добавляем кнопку "Обзор игры", если trailerUrl существует и не равен "затычка"
            if (game.trailerUrl && game.trailerUrl !== "затычка") {
                buttonsHtml += `
                    <button class="trailer-btn" id="trailerBtn">Обзор игры</button>
                `;
            }
            buttonsHtml += `</div>`;

            // Вставляем всё в контейнер (сначала hero/галерея+описание, потом кнопки)
            dynamicContainer.innerHTML = contentHtml + buttonsHtml;

            // Инициализация галереи
            if (galleryItems.length > 0) {
                let currentIndex = 0;
                const galleryItemDiv = document.getElementById('galleryItem');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const dotsContainer = document.getElementById('galleryDots');

                function renderCurrentItem() {
                    const item = galleryItems[currentIndex];
                    galleryItemDiv.innerHTML = `<img src="${item.url}" alt="" class="gallery-main">`;
                    
                    // Обновляем точки
                    const dots = document.querySelectorAll('.dot');
                    dots.forEach((dot, idx) => {
                        if (idx === currentIndex) {
                            dot.classList.add('active');
                        } else {
                            dot.classList.remove('active');
                        }
                    });
                }

                function updateDots() {
                    dotsContainer.innerHTML = '';
                    galleryItems.forEach((_, idx) => {
                        const dot = document.createElement('div');
                        dot.classList.add('dot');
                        if (idx === currentIndex) dot.classList.add('active');
                        dot.addEventListener('click', () => {
                            currentIndex = idx;
                            renderCurrentItem();
                        });
                        dotsContainer.appendChild(dot);
                    });
                }

                if (prevBtn && nextBtn) {
                    prevBtn.addEventListener('click', () => {
                        currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
                        renderCurrentItem();
                    });

                    nextBtn.addEventListener('click', () => {
                        currentIndex = (currentIndex + 1) % galleryItems.length;
                        renderCurrentItem();
                    });
                }

                updateDots();
                renderCurrentItem();
            }

            // Модальное окно для видеообзора
            const modal = document.getElementById('videoModal');
            const modalVideo = document.getElementById('modalVideo');
            const closeModal = document.querySelector('.close-modal');
            const trailerBtn = document.getElementById('trailerBtn');

            if (trailerBtn && game.trailerUrl && game.trailerUrl !== "затычка") {
                trailerBtn.addEventListener('click', () => {
                    modalVideo.src = game.trailerUrl;
                    modal.style.display = 'block';
                    document.body.style.overflow = 'hidden';
                });
            }

            if (closeModal) {
                closeModal.addEventListener('click', () => {
                    modal.style.display = 'none';
                    modalVideo.src = '';
                    document.body.style.overflow = 'auto';
                });
            }

            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    modalVideo.src = '';
                    document.body.style.overflow = 'auto';
                }
            });

            // Отзывы (localStorage)
            const reviewList = document.getElementById('reviewList');
            const reviewName = document.getElementById('reviewName');
            const reviewText = document.getElementById('reviewText');
            const submitBtn = document.getElementById('submitReview');
            const storageKey = `reviews_${gameId}`;

            function loadReviews() {
                const reviews = JSON.parse(localStorage.getItem(storageKey) || '[]');
                reviewList.innerHTML = '';
                reviews.forEach(review => {
                    const item = document.createElement('div');
                    item.className = 'review-item';
                    item.innerHTML = `
                        <div class="review-header">
                            <span class="review-author">${escapeHtml(review.name)}</span>
                            <span class="review-date">${review.date}</span>
                        </div>
                        <div class="review-content">${escapeHtml(review.text)}</div>
                    `;
                    reviewList.appendChild(item);
                });
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    const name = reviewName.value.trim();
                    const text = reviewText.value.trim();
                    if (!name || !text) {
                        alert('Пожалуйста, заполните имя и отзыв');
                        return;
                    }
                    const reviews = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    reviews.push({
                        name: name,
                        text: text,
                        date: new Date().toLocaleDateString('ru-RU')
                    });
                    localStorage.setItem(storageKey, JSON.stringify(reviews));
                    reviewName.value = '';
                    reviewText.value = '';
                    loadReviews();
                });
            }
            loadReviews();

            // Эффект частиц для кнопки "Играть"
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
                function createParticle(x, y) {
                    const particle = document.createElement('span');
                    particle.classList.add('particle');
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.width = `${Math.random() * 8 + 4}px`;
                    particle.style.height = particle.style.width;
                    particle.style.background = `radial-gradient(circle, #00ff9d, #008f5f)`;
                    particle.style.setProperty('--dx', `${(Math.random() - 0.5) * 100}px`);
                    particle.style.setProperty('--dy', `${(Math.random() - 0.5) * 100 - 40}px`);
                    playBtn.appendChild(particle);
                    setTimeout(() => particle.remove(), 700);
                }

                function addParticles(event) {
                    const rect = playBtn.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    for (let i = 0; i < 12; i++) {
                        createParticle(x, y);
                    }
                }

                playBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    addParticles(e);
                    setTimeout(() => {
                        window.location.href = playBtn.href;
                    }, 200);
                });
            }
        }
    </script>

<script>
    // Всплывающее сообщение при клике на имя разработчика
    document.querySelectorAll('.developer-block').forEach(block => {
        block.addEventListener('click', (e) => {
            // Чтобы сообщение не появлялось при клике на иконки соцсетей
            if (e.target.closest('.social-link')) return;
            
            const name = block.querySelector('.author-name')?.innerText || 'разработчик';
            // Создаём временное всплывающее уведомление
            const toast = document.createElement('div');
            toast.textContent = `Спасибо за посещение, ${name}!`;
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                backdrop-filter: blur(10px);
                color: #66c0f4;
                padding: 12px 24px;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                z-index: 10000;
                border: 1px solid rgba(102,192,244,0.3);
                box-shadow: 0 0 20px rgba(102,192,244,0.3);
                opacity: 0;
                transition: opacity 0.3s;
                pointer-events: none;
                white-space: nowrap;
            `;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '1'; }, 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        });
    });
</script>
